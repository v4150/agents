[project]
name = "goat_debate"
version = "0.1.0"
description = "goat_debate using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.201.1,<1.0.0"
]

[project.scripts]
goat_debate = "goat_debate.main:run"
run_crew = "goat_debate.main:run"
train = "goat_debate.main:train"
replay = "goat_debate.main:replay"
test = "goat_debate.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
