[project]
name = "scout_agent"
version = "0.1.0"
description = "scout_agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.201.1,<1.0.0"
]

[project.scripts]
scout_agent = "scout_agent.main:run"
run_crew = "scout_agent.main:run"
train = "scout_agent.main:train"
replay = "scout_agent.main:replay"
test = "scout_agent.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
